name: Post X Tips and Deploy Pages

# 新商品の追加は週1回の Claude Code 定期実行が PR を作り、人がマージする。
# このワークフローは「毎日のX投稿」と「GitHub Pages への公開」だけを行う。

on:
  schedule:
    # 毎日 20:15 JST (11:15 UTC) にXへ実寸Tipsを1件自動投稿（毎時0分の混雑回避）
    - cron: '15 11 * * *'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'products.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'X投稿をドライランにする場合は true'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  post-tip:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 24時間前の products.json と比べて新商品を見つけるため履歴ごと取得する
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests requests-oauthlib

      - name: Post daily millimeter tip to X with mandatory PR tag
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TOOL_PUBLIC_URL: ${{ vars.TOOL_PUBLIC_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/post_x_tip.py --dry-run
          else
            python scripts/post_x_tip.py
          fi

  deploy-pages:
    # index.html / products.json が main に入ったときだけ公開する
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect public files only
        run: |
          mkdir -p _site
          cp index.html products.json _site/
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
